[global]

   server min protocol = SMB2
   workgroup = BEER
   realm = BEER.HOLDINGS.BIZ
   security = ads
   kerberos method = secrets and keytab
   dedicated keytab file = /etc/krb5.keytab

   idmap config * : backend = tdb
   idmap config * : range = 3000-7999

   idmap config BEER : backend = rid
   idmap config BEER : range = 10000-2147483647

#   template shell = /bin/bash
#переезд домашних папок
#   template homedir = /public/%U
   ntlm auth = no
   winbind enum users = no
   winbind enum groups = no
   winbind expand groups = 1
   winbind normalize names = yes
   winbind use default domain = yes
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
#   server role = member server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = never

[public]
   comment = обменник
   path = /public
   browseable = yes
   read only = no
   create mask = 0700
   directory mask = 0700
   guest ok = no
   access based share enum = yes
#   root preexec = /usr/sbin/mkhomedir_helper %u
   hide unreadable = yes
#-корзина-
   vfs objects = recycle
   recycle:repository = %U/.recycle
#сохранение структуры пути
   recycle:keeptree = yes
   recycle:versions = yes
#смена метаданых (время изменения содержимого)
   recycle:touch_mtime = yes
   admin users = @"Администраторы домена"
#   valid users = @"Пользователи домена"
   root preexec close = yes
   root preexec = /usr/local/sbin/mk-share-folder.sh "%u"
   veto files = /.recycle/
   delete veto files = no